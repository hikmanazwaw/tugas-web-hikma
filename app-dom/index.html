<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body onload="showData()" class="bg-light py-5">
    <div class="container" style="max-width: 600px">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="card-title text-center mb-4">Agenda Kegiatan</h1>

          <div class="mb-3">
            <label for="agenda" class="form-label fw-semibold"
              >Masukan Kegiatan Anda</label
            >
            <input type="text" id="agenda" class="form-control" />
          </div>

          <button onclick="addData()" class="btn btn-primary w-100 mb-4">
            Simpan
          </button>

          <hr />

          <h3 class="h5 mb-3">Daftar Agenda</h3>
          <ul id="daftar" class="list-group"></ul>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/my-script.js"></script>
  </body>
</html>
